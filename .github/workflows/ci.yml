name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck entrypoint.sh

  json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validation du JSON
        run: python3 -m json.tool settings.default.json > /dev/null

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build de l'image
        run: docker build -t rkz-transmission-openvpn:ci .
      - name: Smoke test - sans .ovpn, le conteneur doit sortir en erreur (exit 1)
        run: |
          set +e
          out=$(docker run --rm rkz-transmission-openvpn:ci 2>&1)
          code=$?
          echo "$out"
          if [ "$code" -ne 1 ]; then
            echo "::error::exit attendu 1, obtenu $code"
            exit 1
          fi
          echo "$out" | grep -q "aucun fichier .ovpn"
