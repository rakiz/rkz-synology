name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: shellcheck docker/entrypoint.sh

  json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: JSON validation
        run: python3 -m json.tool configuration/settings.json.example > /dev/null

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the image
        run: docker build -f docker/Dockerfile -t rkz-transmission-openvpn:ci .
      - name: Smoke test - without an .ovpn the container must exit with code 1
        run: |
          set +e
          out=$(docker run --rm rkz-transmission-openvpn:ci 2>&1)
          code=$?
          echo "$out"
          if [ "$code" -ne 1 ]; then
            echo "::error::expected exit 1, got $code"
            exit 1
          fi
          echo "$out" | grep -q "no .ovpn file found"
