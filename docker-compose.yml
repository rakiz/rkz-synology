services:
  rkz-transmission-openvpn:
    build:
      # the Dockerfile lives in docker/, but the context is the repository
      # root (it copies the Transmission template from configuration/)
      context: .
      dockerfile: docker/Dockerfile
    image: rkz/transmission-openvpn:1.0
    container_name: rkz-transmission-openvpn
    cap_add:
      - NET_ADMIN
      - DAC_OVERRIDE
    environment:
      # Timestamps in vpn-status.json and logs use this timezone (needs tzdata)
      - TZ=Europe/Paris
    # The peer port 51413 is NOT published on the host: the VPN provider has
    # no port forwarding, so peers can only be reached through the tunnel.
    # Publishing it would open a useless docker-proxy on the host (leak
    # vector) with no benefit.
    ports:
      - "9091:9091"
    # Cap the log files: the streamed [openvpn] lines are verbose, and
    # without rotation they would grow unbounded
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    healthcheck:
      test: ["CMD-SHELL", "grep -q '\"tunnel_up\": true' /config/vpn-status.json"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 2m
    volumes:
      # Configuration and VPN files live inside the project folder; the
      # torrent data lives outside it.
      - ./config:/config
      - /volume1/torrents:/data
      - ./openvpn:/openvpn:ro
    restart: unless-stopped
    # Give Transmission time to flush its state (settings/resume) before
    # Docker sends SIGKILL; without this the entrypoint shutdown procedure
    # can be cut short.
    stop_grace_period: 30s
